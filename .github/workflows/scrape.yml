name: Scrape podcast data

on:
  schedule:
    # Offset from :00 — GitHub Actions explicitly documents the top of
    # every hour as its highest-congestion slot for scheduled workflows,
    # where runs can be delayed or dropped entirely.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      podcast_title:
        description: 'Scope this run to a single show by exact title (leave blank for the full sweep)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PODCAST_TITLE: ${{ inputs.podcast_title }}
      # Only the affiliation step uses it; that step is skipped while unset.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scraper dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Scrape episodes
        working-directory: scraper
        run: |
          if [ -n "$PODCAST_TITLE" ]; then
            python3 manager.py scrape --podcast "$PODCAST_TITLE" --db "$DATABASE_URL"
          else
            python3 manager.py scrape --new-only --db "$DATABASE_URL"
          fi

      - name: Backfill missing episodes
        working-directory: scraper
        if: ${{ !inputs.podcast_title }}
        run: python3 manager.py backfill --db "$DATABASE_URL"

      - name: Scrape show-level host data
        working-directory: scraper
        run: |
          if [ -n "$PODCAST_TITLE" ]; then
            python3 apple_credits_scraper.py shows --podcast "$PODCAST_TITLE" --db "$DATABASE_URL"
          else
            python3 apple_credits_scraper.py shows --db "$DATABASE_URL"
          fi

      - name: Scrape host/guest credits
        working-directory: scraper
        timeout-minutes: 35
        run: |
          if [ -n "$PODCAST_TITLE" ]; then
            python3 apple_credits_scraper.py episodes --hosts-only --podcast "$PODCAST_TITLE" --db "$DATABASE_URL"
          else
            python3 apple_credits_scraper.py episodes --hosts-only --batch 500 --db "$DATABASE_URL"
          fi

      - name: Extract hosts from show metadata
        working-directory: scraper
        run: python3 host_extractor.py run

      # Both scans now read descriptions as well as titles. Titles are the
      # low-precision source: over the whole archive they yield 27 new
      # candidates, nearly all noun phrases, while descriptions yield 611 of
      # which roughly four in five are real people. Descriptions used to be
      # unaffordable — 17 minutes archive-wide — until candidates were looked
      # up by surname, which brought a full pass under a second.
      - name: Scan episodes for known names
        working-directory: scraper
        run: python3 episode_name_scanner.py run

      - name: Queue new-name suggestions for review
        working-directory: scraper
        run: python3 episode_name_scanner.py suggest

      # Job title / organisation for new guest credits (extract_affiliations.py).
      # Collects batches submitted by earlier runs (then creates organisations
      # for new company spellings) and submits appearances not yet processed;
      # a batch finishes between runs. Capped at 1,000 appearances / $2 a run —
      # over the cap it logs and waits for the next run. continue-on-error: an
      # API problem here must never stop the run from being recorded as done.
      - name: Extract guest roles and companies
        working-directory: scraper
        if: ${{ env.ANTHROPIC_API_KEY != '' && !inputs.podcast_title }}
        continue-on-error: true
        run: python3 extract_affiliations.py run --model claude-sonnet-5 --limit 1000 --max-cost 2

      # Replays of an appearance already credited on the same show, and
      # credits that only refer to another episode (credit_cleanup.py).
      # After extraction, which is what flags the second kind.
      - name: Remove replay and other-episode credits
        working-directory: scraper
        if: ${{ !inputs.podcast_title }}
        continue-on-error: true
        run: python3 credit_cleanup.py run

      - name: Record successful run timestamp
        working-directory: scraper
        run: python3 mark_scrape_complete.py --db "$DATABASE_URL"
